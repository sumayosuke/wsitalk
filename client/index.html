<!DOCTYPE html>
<html lang="ja">
<body>
  <h2>WebSocket Chat</h2>

  <div id="chat">
    <div id="messages" style="border:1px solid #ccc; height:200px; overflow:auto;"></div>

    <input id="input" type="text" placeholder="メッセージを入力 (/q または /l でログアウト)" />
    <button onclick="sendMessage()">送信</button>
  </div>

  <script>
    let ws;
    let handle;

    window.onload = () => {
      // ページを開いたらハンドル名を入力させる
      handle = prompt("ハンドル名を入力してください");
      if (!handle) {
        alert("ハンドル名が必要です");
        location.reload();
        return;
      }

      ws = new WebSocket("ws://localhost:8080");

      ws.onopen = () => {
        // 🔥 最初のメッセージとしてハンドル名を送信（/login は不要）
        ws.send(handle);
      };

      ws.onmessage = (event) => {
        const messages = document.getElementById("messages");
        messages.innerHTML += `<div>${event.data}</div>`;
        messages.scrollTop = messages.scrollHeight;
      };

      ws.onclose = () => {
        alert("接続が終了しました");
        location.reload();
      };
    };

    function sendMessage() {
      const input = document.getElementById("input");
      const text = input.value;

      // 🔥 ログアウトコマンドはサーバー側で処理
      ws.send(text);

      input.value = "";
    }
  </script>
</body>
</html>
